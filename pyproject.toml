[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumart"
version = "2.4.0"
description = "A high-fidelity image-to-terminal renderer written in Python and C++."
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-only"
dependencies = [
    "Pillow>=10.0.0"
]

[project.scripts]
lumart = "lumart:main"
luma = "lumart:main"

[tool.setuptools]
py-modules = ["lumart", "mary"]
